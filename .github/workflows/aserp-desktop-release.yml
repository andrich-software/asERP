name: Release asERP Desktop

on:
  push:
    branches: [ main ]
    paths:
      - 'src/asERP.Client/**'
      - 'src/asERP.Domain/**'
  workflow_dispatch:

# Rapid successive pushes: each run releases under its own tag, so cancelling a
# superseded run just skips an already-outdated release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The self-hosted runner user cannot write to setup-dotnet's default
  # install dir (/usr/share/dotnet) — install into the runner's home instead.
  DOTNET_INSTALL_DIR: /opt/actions-runner/.dotnet

jobs:
  # Single job on purpose: the runner has one job slot, so separate
  # version/build/release jobs only queued behind each other and repeated
  # checkout + workload restore three times. All three targets are
  # cross-compiled on the same Linux runner anyway.
  build-and-release:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        VERSION=$(date +%Y.%m.%d).${GITHUB_RUN_NUMBER}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore workloads
      run: dotnet workload restore src/asERP.Client/asERP.Client.csproj

    - name: Restore dependencies
      run: dotnet restore src/asERP.Client/asERP.Client.csproj

    # Cross-compiled on the Linux runner: -r win-x64 produces the Windows apphost
    # (asERP.Client.exe) and pulls win-x64 native assets (SkiaSharp etc.) from NuGet.
    # --self-contained false keeps it framework-dependent (still needs .NET 10 runtime),
    # matching the previous windows-latest build and the release notes.
    - name: Publish Windows
      run: |
        dotnet publish src/asERP.Client/asERP.Client.csproj \
          --configuration Release \
          --framework net10.0-desktop \
          --runtime win-x64 \
          --self-contained false \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          --output ./publish/windows

    - name: Publish Linux
      run: |
        dotnet publish src/asERP.Client/asERP.Client.csproj \
          --configuration Release \
          --framework net10.0-desktop \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          --output ./publish/linux

    # osx-arm64 matches what macos-latest (Apple Silicon) produced before; switch
    # to osx-x64 if Intel Macs must be served natively.
    - name: Publish macOS
      run: |
        dotnet publish src/asERP.Client/asERP.Client.csproj \
          --configuration Release \
          --framework net10.0-desktop \
          --runtime osx-arm64 \
          --self-contained false \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          --output ./publish/macos

    - name: Create archives
      run: |
        if [ -f "./publish/windows/asERP.Client.exe" ]; then
          mv ./publish/windows/asERP.Client.exe ./publish/windows/asERP.Desktop.exe
        fi
        if [ -f "./publish/linux/asERP.Client" ]; then
          mv ./publish/linux/asERP.Client ./publish/linux/asERP.Desktop
        fi
        if [ -f "./publish/macos/asERP.Client" ]; then
          mv ./publish/macos/asERP.Client ./publish/macos/asERP.Desktop
        fi
        (cd publish/windows && zip -r ../asERP.Desktop-${{ steps.version.outputs.VERSION }}-windows.zip .)
        (cd publish/linux && tar -czf ../asERP.Desktop-${{ steps.version.outputs.VERSION }}-linux.tar.gz .)
        (cd publish/macos && tar -czf ../asERP.Desktop-${{ steps.version.outputs.VERSION }}-macos.tar.gz .)

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: asERP Desktop v${{ steps.version.outputs.VERSION }}
        body: |
          ## asERP Desktop Release v${{ steps.version.outputs.VERSION }}

          Automatisch erstelltes Release der asERP Desktop-Anwendung (Uno Platform).

          ### Voraussetzungen
          - **.NET 10 Runtime** muss installiert sein: https://dotnet.microsoft.com/download/dotnet/10.0

          ### Downloads
          - **Windows**: `asERP.Desktop-${{ steps.version.outputs.VERSION }}-windows.zip`
          - **Linux**: `asERP.Desktop-${{ steps.version.outputs.VERSION }}-linux.tar.gz`
          - **macOS**: `asERP.Desktop-${{ steps.version.outputs.VERSION }}-macos.tar.gz`

          ### Installation
          1. Installieren Sie die .NET 10 Runtime (falls noch nicht vorhanden)
          2. Laden Sie die entsprechende Datei für Ihr Betriebssystem herunter
          3. Entpacken Sie das Archiv
          4. Führen Sie die Anwendung aus

          ---

          🤖 Automatisch erstellt durch GitHub Actions
        draft: false
        prerelease: false
        files: |
          publish/asERP.Desktop-${{ steps.version.outputs.VERSION }}-windows.zip
          publish/asERP.Desktop-${{ steps.version.outputs.VERSION }}-linux.tar.gz
          publish/asERP.Desktop-${{ steps.version.outputs.VERSION }}-macos.tar.gz
        token: ${{ secrets.GITHUB_TOKEN }}
