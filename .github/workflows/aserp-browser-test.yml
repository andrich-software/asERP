name: asERP.Client Build and Test

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'src/asERP.Domain/**'
      - 'src/asERP.Client/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/asERP.Domain/**'
      - 'src/asERP.Client/**'

# A newer push to the same branch supersedes the running test — cancel it so it
# stops blocking the single-slot self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The self-hosted runner user cannot write to setup-dotnet's default
  # install dir (/usr/share/dotnet) — install into the runner's home instead.
  DOTNET_INSTALL_DIR: /opt/actions-runner/.dotnet

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore workloads
        run: dotnet workload restore src/asERP.Client/asERP.Client.csproj

      - name: Restore asERP.Client.Tests
        run: dotnet restore tests/asERP.Client.Tests -p:TargetFramework=net10.0
      - name: Build asERP.Client.Tests
        run: dotnet build tests/asERP.Client.Tests -p:TargetFramework=net10.0
      - name: Test asERP.Client.Tests
        run: dotnet test tests/asERP.Client.Tests --no-build --verbosity normal
