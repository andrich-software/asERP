name: asERP.Client Browser Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'src/asERP.Domain/**'
      - 'src/asERP.Client/**'

# Rapid successive pushes: only the newest image matters — cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # No dotnet setup/restore here on purpose: the entire build happens inside
      # the Dockerfile, which does its own workload install and restore.

      # QEMU is still needed for the arm64 nginx runtime stage (RUN steps in the
      # final image); the expensive .NET build itself runs natively via
      # --platform=$BUILDPLATFORM in the Dockerfile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: andrichsoftware/aserp-web

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/asERP.Client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: andrichsoftware/aserp-web:latest
          # Registry-backed layer cache: reuses the workload-install and restore
          # layers between runs as long as the project files are unchanged.
          cache-from: type=registry,ref=andrichsoftware/aserp-web:buildcache
          cache-to: type=registry,ref=andrichsoftware/aserp-web:buildcache,mode=max
