name: Release asERP Server Setup (Windows)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/asERP.Server/**'
      - 'src/asERP.Server.Tray/**'
      - 'src/asERP.Domain/**'
      - 'src/asERP.Application/**'
      - 'src/asERP.Analytics/**'
      - 'src/asERP.Identity/**'
      - 'src/asERP.Infrastructure/**'
      - 'src/asERP.Persistence/**'
      - 'src/asERP.Persistence.MSSQL/**'
      - 'src/asERP.Persistence.PostgreSQL/**'
      - 'src/asERP.Persistence.SQLite/**'
      - 'src/asERP.SalesChannels/**'
      - 'src/asERP.Shipping/**'
      - 'installer/**'
  workflow_dispatch:

# Rapid successive pushes: each run releases under its own tag, so cancelling a
# superseded run just skips an already-outdated release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      shell: pwsh
      run: |
        # YYYY.MM.DD.RunNumber — identical scheme to the other release workflows.
        $version = "{0}.{1}" -f (Get-Date -Format 'yyyy.MM.dd'), $env:GITHUB_RUN_NUMBER
        "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Host "Generated version: $version"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Publish server (self-contained win-x64)
      run: |
        dotnet publish src/asERP.Server/asERP.Server.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:Version=${{ steps.version.outputs.VERSION }} `
          -p:GeneratePackageOnBuild=false `
          --output ./publish/server
      shell: pwsh

    - name: Publish tray (self-contained win-x64)
      run: |
        dotnet publish src/asERP.Server.Tray/asERP.Server.Tray.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:Version=${{ steps.version.outputs.VERSION }} `
          --output ./publish/tray
      shell: pwsh

    - name: Compile installer
      run: |
        # Inno Setup 6 is preinstalled on windows-latest images; fall back to choco.
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          choco install innosetup -y --no-progress
        }
        & $iscc `
          /DAppVersion=${{ steps.version.outputs.VERSION }} `
          /DServerPublishDir=..\publish\server `
          /DTrayPublishDir=..\publish\tray `
          installer\asERP.Server.Setup.iss
      shell: pwsh

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: installer/output/asERP-Server-Setup-${{ steps.version.outputs.VERSION }}.exe
        # Hand-off to the release job only; final installer lives in the GitHub Release.
        retention-days: 1

  release:
    runs-on: [self-hosted, Linux, X64]
    needs: build-installer
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # "server-v" prefix keeps server releases apart from desktop client tags ("v...");
        # the tray update checker filters on this prefix — never use /releases/latest.
        tag_name: server-v${{ needs.build-installer.outputs.version }}
        name: asERP Server v${{ needs.build-installer.outputs.version }}
        body: |
          ## asERP Server v${{ needs.build-installer.outputs.version }} (Windows)

          Self-contained Windows installer — no .NET runtime required.
          Installs the asERP server as a Windows service plus a tray app for
          status, start/stop, settings and database backup/restore.

          ### Installation
          1. Download `asERP-Server-Setup-${{ needs.build-installer.outputs.version }}.exe`
          2. Run the installer (data is stored in `C:\ProgramData\asERP`)
          3. The service starts automatically; the tray icon appears after login

          Upgrades over an existing installation keep all data and settings.

          ---

          🤖 Automatically built by GitHub Actions
        draft: false
        prerelease: false
        files: artifacts/installer/*.exe
        token: ${{ secrets.GITHUB_TOKEN }}
